<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf7f2"><title>Stremio Setup • A simple guided walkthrough</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#2b2622;background:#faf7f2}*{box-sizing:border-box}body{margin:0}.shell{max-width:690px;margin:auto;padding:22px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.brand{font-weight:800;font-size:19px;letter-spacing:-.6px}.progress{display:flex;gap:6px;margin:16px 0 26px}.progress span{height:7px;flex:1;border-radius:99px;background:#e7ddd0}.progress span.on{background:#7d2c3e}.stepcount{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;color:#176f61}h1{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:clamp(30px,6vw,43px);line-height:1.12;letter-spacing:-.5px;margin:12px 0}p{color:#6f665b;line-height:1.65}main{background:white;border:1px solid #e7ded1;border-radius:23px;padding:clamp(22px,5vw,40px);box-shadow:0 12px 45px #3c281010}.hint{padding:14px 16px;background:#f5efe4;border-radius:12px;color:#5c4f42;font-size:14px;line-height:1.55;margin:20px 0}.warning{background:#fff5e8;color:#7b5227}.item{margin:22px 0}.item h3{font-size:16px;margin:0 0 7px}.item p{margin:0 0 12px;font-size:14px}.action{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:12px 16px;text-decoration:none;font-size:14px;font-weight:750;background:#7d2c3e;color:white;border:0;cursor:pointer}.action.secondary{background:#eaf4ef;color:#176f61}.copyrow{display:flex;gap:8px;align-items:stretch;margin:10px 0}.copyrow code{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;background:#f4f1ec;border:1px solid #e5ddd0;padding:14px;border-radius:11px;font-size:12px;line-height:1.6;color:#3d352c}.copyrow button{align-self:stretch;white-space:nowrap}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.nav button{min-width:105px}.nav button:disabled{opacity:.3;cursor:not-allowed}.checks{display:grid;gap:11px;margin-top:20px}.checks label{display:flex;align-items:start;gap:10px;color:#4a4238;font-size:14px;line-height:1.45}.checks input{accent-color:#7d2c3e;width:17px;height:17px}.muted{font-size:12px;color:#8a8177}details{border-top:1px solid #e7ded1;padding:15px 0}summary{font-weight:700;cursor:pointer}footer{text-align:center;font-size:12px;color:#8a8177;margin-top:28px}button:focus-visible,a:focus-visible{outline:3px solid #e0b756;outline-offset:3px}@media(max-width:430px){.copyrow{flex-direction:column}.copyrow button{align-self:flex-start}}
</style></head><body><div class="shell"><header><div class="brand">✦ Stremio Setup</div></header><div id="progress" class="progress" aria-label="Setup progress"></div><main><div id="stepcount" class="stepcount"></div><div id="content"></div><div class="nav"><button class="action secondary" id="back">← Back</button><button class="action" id="next">Next step →</button></div></main><footer>Unofficial community guide • Use only content you have the right to watch • Never share passwords, API keys, or private addon links.</footer></div><script>
const referral='3f5b6ad7-99ca-4b37-91a3-5aa3babf9bcf';
const sort='-resolution,-quality,-hdr,-size';
const filter='!(upper(Raw.Name) contains ".CAM") &&\n!(upper(Raw.Name) contains "TELESYNC") &&\n!(upper(Raw.Name) contains "HDCAM") &&\n!(upper(Raw.Name) contains "HDTS") &&\n!(upper(Raw.Name) contains ".TS.") &&\nFile.Size < "25 GB"';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,label)=>`<a class="action secondary" href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`;
const copy=(value,label)=>`<div class="copyrow"><code>${esc(value)}</code><button class="action secondary" data-copy="${label}">Copy</button></div>`;
const section=(title,body)=>`<section class="item"><h3>${title}</h3>${body}</section>`;
const steps=[
{title:'Let’s get you watching.',intro:'Follow these steps in order. You’ll set everything up on your phone or computer first, then sign in on your TV.',html:()=>`<div class="hint">⏱ Allow about 30–45 minutes. You’ll need an email address, a payment method, and your phone or computer.</div><p><strong>Stremio</strong> is the app you watch in. <strong>TorBox</strong> is the paid service that provides the streams — a debrid service. <strong>Torz</strong> is the main addon that finds them, and <strong>Comet</strong> is the backup. Both only show cached streams: files already downloaded and ready to play, so they start fast instead of buffering.</p><div class="checks"><label><input type="checkbox" data-check="0a"> I have my phone or computer ready.</label><label><input type="checkbox" data-check="0b"> I can access the TV or streaming device I’ll use.</label></div>`},
{title:'Create your TorBox account.',intro:'This is the service that connects to the streaming addons.',html:()=>`${section('1. Create an account',`<p>Open TorBox, sign up with your own email, and verify your account.</p>${link('https://torbox.app','Open TorBox')}`)}${section('2. Choose a plan',`<p>Start with a monthly plan — you can change it later. Check current pricing and renewal details on TorBox.</p>`)}${section('3. Apply the referral code',`<p>On the TorBox subscriptions page, look for the referral code field. Tap Copy below, then paste it there. It gets you extra free days on TorBox.</p>${copy(referral,'referral')}`)}${section('4. Find your API key',`<p>Open your TorBox account settings and find your API key. Copy it. You’ll paste it directly into Comet and Torz. Treat it like a password.</p>`)}<div class="hint warning">Never paste your API key into this guide, send it in a text, or share an addon install link containing it.</div>`},
{title:'Create your Stremio account.',intro:'Your Stremio login syncs your addons across devices.',html:()=>`${section('1. Sign up',`<p>Use your own email and password. Stremio and TorBox are two different accounts.</p>${link('https://www.stremio.com','Open Stremio')}`)}${section('2. Sign in on your phone or computer',`<p>Use the Stremio app or web interface to finish installing addons. Avoid Guest mode.</p>${link('https://web.stremio.com','Open Stremio Web')}`)}<div class="hint">Leave this wizard open in one tab. You can return to it after each addon installation.</div>`},
{title:'Connect Torz.',intro:'Torz is your main stream-finder.',html:()=>`${section('1. Open public StremThru Torz',`<p>This is a public community-hosted instance, not a server you need to run yourself. Availability and maintenance are controlled by its operator.</p>${link('https://stremthrufortheweebs.midnightignite.me/stremio/torz/configure','Configure Torz')}`)}${section('2. Store settings',`<p>Choose <strong>TorBox</strong> for Store Name. Paste your own TorBox API key into Store Token. Turn on <strong>Only Show Cached Content</strong>.</p>`)}${section('3. Indexers',`<p>Leave the Indexers section empty — those are the search sources, and you don't need them. Do not tap Add.</p>`)}${section('4. Stream Sort — copy exactly',`<p>Paste into the Stream Sort field.</p>${copy(sort,'sort')}`)}${section('5. Stream Filter — advanced',`<p>This filter blocks cam and telesync copies and caps files at 25 GB. If the site shows a parser error, clear the field and install without it — Torz still works, and Comet is there as a backup.</p>${copy(filter,'filter')}`)}${section('6. Install',`<p>Tap Install and confirm in Stremio — Stremio opening to confirm is how you know it worked. Don’t share the install link Stremio generates: it may contain private configuration information.</p>`)}<div class="hint warning">Important: Public addon instances can change or go offline. If this link fails, use the troubleshooting section rather than entering your key on an unfamiliar mirror.</div>`},
{title:'Connect Comet.',intro:'Comet is your second stream-finder — a backup if Torz misses something.',html:()=>`${section('1. Open Comet',`<p>Open the Comet configuration page and select TorBox as the debrid provider.</p>${link('https://comet.elfhosted.com/configure','Configure Comet')}`)}${section('2. Paste your TorBox API key',`<p>Copy it from TorBox settings and paste it directly into Comet.</p>`)}${section('3. Recommended starting settings',`<p>Turn on cached-only streams, duplicate removal, and low-quality filtering. Set the file limit to 25 GB. Labels may vary slightly by version.</p>`)}${section('4. Install',`<p>Tap Install, confirm the installation in Stremio, and return here. Stremio opening to confirm is how you know it worked.</p>`)}<div class="hint">If the page doesn’t open Stremio automatically, use the addon install link in Stremio’s addon installation field. Keep that personalized link private.</div>`},
{title:'Watch on your TV.',intro:'Your addons should already be linked to your Stremio account.',html:()=>`${section('1. Install Stremio',`<p>On Google TV / Onn / Android TV, open the Play Store and install Stremio. On other devices, use the official download instructions.</p>${link('https://www.stremio.com/downloads','Stremio downloads')}`)}${section('2. Sign in',`<p>Use the <strong>same Stremio account</strong> from earlier. Wait for your addons to sync.</p>`)}${section('3. Test playback',`<p>Search for a title you have the right to watch. Select an available TorBox cached stream. For most TVs, 1080p is a good starting point. If it buffers, try a smaller file.</p>`)}<div class="checks"><label><input type="checkbox" data-check="5a"> I can see Torz or Comet stream results.</label><label><input type="checkbox" data-check="5b"> Playback works on my device.</label></div>`},
{title:'All set! Keep this link.',intro:'Come back whenever you need to fix something or set up another device.',html:()=>`<div class="hint">You’ve completed the setup. Save or bookmark this page for later.</div><details><summary>Nothing plays or no streams appear</summary><p>Check your TorBox subscription, verify you’re signed into the correct Stremio account, and try another available stream. Reinstall Comet or Torz if you changed the API key.</p></details><details><summary>Video buffers</summary><p>Try a smaller 1080p stream, restart Stremio and your streaming device, and check your network connection.</p></details><details><summary>How do I use an iPhone or iPad?</summary><p>Open web.stremio.com in Safari, sign in, and dismiss the 'Streaming server is not available' warning if it appears. Set Stremio to play in an external player, and install VLC or Outplayer first — otherwise tapping a stream gives an 'address is invalid' error.</p></details><details><summary>What if the public Torz instance stops working?</summary><p>Comet may still work independently. Public community instances are not guaranteed to stay online. Avoid entering API keys on unknown replacement websites.</p></details><details><summary>Why do I need to reinstall an addon after changing settings?</summary><p>Many addon configuration pages generate a new install URL when settings change. Reinstall the addon to apply the new configuration.</p></details><button class="action secondary" id="restart">Start over ↺</button>`}
];
let current=Math.min(Math.max(parseInt(localStorage.getItem('wizard-step')||'0',10)||0,0),steps.length-1);
function render(){document.getElementById('progress').innerHTML=steps.map((_,i)=>`<span class="${i<=current?'on':''}"></span>`).join('');document.getElementById('stepcount').textContent=`Step ${current+1} of ${steps.length}`;document.getElementById('content').innerHTML=`<h1>${steps[current].title}</h1><p>${steps[current].intro}</p>${steps[current].html()}`;document.getElementById('back').disabled=current===0;document.getElementById('next').textContent=current===steps.length-1?'Finish ✓':'Next step →';document.querySelectorAll('[data-copy]').forEach(btn=>btn.addEventListener('click',async()=>{let value=btn.dataset.copy==='referral'?referral:btn.dataset.copy==='sort'?sort:filter;try{await navigator.clipboard.writeText(value);btn.textContent='Copied ✓';setTimeout(()=>btn.textContent='Copy',1600)}catch(e){btn.textContent='Select text above'}}));document.querySelectorAll('[data-check]').forEach(input=>{input.checked=localStorage.getItem('wizard-check-'+input.dataset.check)==='yes';input.addEventListener('change',()=>localStorage.setItem('wizard-check-'+input.dataset.check,input.checked?'yes':'no'))});document.getElementById('restart')?.addEventListener('click',()=>{current=0;localStorage.setItem('wizard-step',current);render();window.scrollTo(0,0)})}
document.getElementById('back').onclick=()=>{current=Math.max(0,current-1);localStorage.setItem('wizard-step',current);render();window.scrollTo(0,0)};document.getElementById('next').onclick=()=>{if(current<steps.length-1){current++;localStorage.setItem('wizard-step',current);render();window.scrollTo(0,0)}else alert('Setup complete! Bookmark this page for later.')};render();
</script></body></html>
