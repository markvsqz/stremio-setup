<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3d2e"><title>Stremio Setup Wizard</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14261c;background:#eef6ec}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef6ec}.shell{max-width:690px;margin:auto;padding:22px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px;background:#0b3d2e;border:3px solid #111;border-radius:16px;padding:16px 20px;box-shadow:6px 6px 0 #111}.brand{font-family:'Arial Black',Impact,'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:19px;letter-spacing:1px;text-transform:uppercase;color:#fff}.progress{display:flex;gap:6px;margin:16px 0 26px}.progress span{height:14px;flex:1;border-radius:99px;background:#fff;border:2px solid #111}.progress span.done{background:#178a4c}.progress span.now{background:#ffd60a}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}.stepcount{display:inline-block;font-family:'Arial Black',Impact,'Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:#111;background:#ffd60a;border:2px solid #111;border-radius:999px;padding:6px 12px;box-shadow:3px 3px 0 #111}h1{font-family:'Arial Black',Impact,'Helvetica Neue',Arial,sans-serif;font-weight:900;font-size:clamp(30px,7vw,46px);line-height:1.12;letter-spacing:-.5px;margin:16px 0 12px;color:#0d1f16}p{color:#2e4034;line-height:1.65}strong{color:#0d1f16}main{background:#fff;border:3px solid #111;border-radius:20px;padding:clamp(22px,5vw,40px);box-shadow:8px 8px 0 #111}.hint{padding:14px 16px;background:#fff7cc;border:2px solid #111;border-radius:12px;color:#3d3400;font-size:14px;line-height:1.55;margin:20px 0}.warning{background:#ffe1a8;color:#4a2f00}.item{margin:22px 0}.item h3{font-family:'Arial Black',Impact,'Helvetica Neue',Arial,sans-serif;font-size:15px;letter-spacing:.3px;margin:0 0 7px;color:#0d1f16}.item p{margin:0 0 12px;font-size:14px}.action{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 18px;text-decoration:none;font-size:15px;font-weight:800;background:#ffd60a;color:#111;border:3px solid #111;cursor:pointer;box-shadow:4px 4px 0 #111}.action:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #111}.action:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #111}.action.secondary{background:#fff;color:#0b3d2e;border:3px solid #111;box-shadow:4px 4px 0 #111}.copyrow{display:flex;gap:8px;align-items:stretch;margin:10px 0}.copyrow code{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;background:#0d3b2e;border:2px solid #111;padding:14px;border-radius:12px;font-size:12px;line-height:1.6;color:#d8ffe9}.copyrow button{align-self:stretch;white-space:nowrap}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.nav button{min-width:105px}.nav button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}.checks{display:grid;gap:11px;margin-top:20px}.checks label{display:flex;align-items:start;gap:10px;color:#2e4034;font-size:14px;line-height:1.45}.checks input{accent-color:#178a4c;width:18px;height:18px}.muted{font-size:12px;color:#5f7268}details{border-top:2px solid #111;padding:15px 0}summary{font-weight:700;cursor:pointer;color:#0b3d2e}footer{text-align:center;font-size:12px;color:#5f7268;margin-top:28px}button:focus-visible,a:focus-visible{outline:3px solid #178a4c;outline-offset:3px}@media(max-width:430px){.copyrow{flex-direction:column}.copyrow button{align-self:flex-start}main{box-shadow:5px 5px 0 #111}header{box-shadow:4px 4px 0 #111}}
</style></head><body><div class="shell"><header><div class="brand">✦ Stremio Setup Wizard</div></header><div id="progress" class="progress" aria-label="Setup progress"></div><main><div id="stepcount" class="stepcount"></div><div id="content"></div><div class="nav"><button class="action secondary" id="back">← Back</button><button class="action" id="next">Next step →</button></div></main><footer>Unofficial community guide • Never share passwords, API keys, or private addon links.</footer></div><script>
const referral='3f5b6ad7-99ca-4b37-91a3-5aa3babf9bcf';
const sort='-resolution,-quality,-hdr,-size';
const filter='!(upper(Raw.Name) contains ".CAM") &&\n!(upper(Raw.Name) contains "TELESYNC") &&\n!(upper(Raw.Name) contains "HDCAM") &&\n!(upper(Raw.Name) contains "HDTS") &&\n!(upper(Raw.Name) contains ".TS.") &&\nFile.Size < "25 GB"';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,label)=>`<a class="action secondary" href="${url}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`;
const copy=(value,label)=>`<div class="copyrow"><code>${esc(value)}</code><button class="action secondary" data-copy="${label}">Copy</button></div>`;
const section=(title,body)=>`<section class="item"><h3>${title}</h3>${body}</section>`;
const steps=[
{title:'Stremio Setup Wizard',intro:'Do the steps in order. Set everything up on your phone or computer first, then sign in on your TV.',html:()=>`<div class="hint">⏱ Allow about 30–45 minutes. You’ll need an email address, a payment method, and your phone or computer.</div><p><strong>Stremio</strong> is the app you watch in. <strong>TorBox</strong> is the paid service that finds the videos for you. <strong>Torz</strong> and <strong>Comet</strong> are the two helpers that do the finding — Torz first, Comet as backup. They only show videos that are ready to play right away, so things start fast instead of buffering.</p><details><summary>Do I need a VPN? Is this safe? 🔒</summary><p>Nope — no VPN needed. You’re streaming through TorBox, not downloading torrents yourself, so you’re not sharing files with strangers.</p></details><p class="muted">Only watching on an iPhone or iPad? Your playback steps are in the 'Watch on your TV' step.</p><div class="checks"><label><input type="checkbox" data-check="0a"> I have my phone or computer ready.</label><label><input type="checkbox" data-check="0b"> I can access the TV or streaming device I’ll use.</label></div>`},
{title:'Create your TorBox account.',intro:'This is the paid service that finds your videos.',html:()=>`${section('1. Create an account',`<p>Open TorBox, sign up with your own email, and verify your account.</p>${link('https://torbox.app','Open TorBox')}`)}${section('2. Choose a plan',`<p>Pick the <strong>Essential</strong> plan — $3/month, or $33/year if you pay yearly. Start monthly; you can switch later. Prices can change, so check TorBox. 3 slots is plenty — watching a video doesn’t use one.</p>`)}<details><summary>Can I watch on more than one device?</summary><p>Yes — a few people can watch at the same time on different devices. Just don’t go crazy with it.</p></details>${section('3. Apply the referral code',`<p>On the TorBox subscriptions page, look for the referral code field. Tap Copy below, then paste it there. It gets you extra free days on TorBox.</p>${copy(referral,'referral')}`)}${section('4. Find your API key',`<p>Open your TorBox settings and find your API key. Copy it and treat it like a password. You’ll paste it into Torz and Comet — never into this guide.</p>${link('https://torbox.app/settings','Open TorBox settings')}`)}<div class="hint warning">Never paste your API key into this guide, send it in a text, or share an addon install link containing it.</div>`},
{title:'Create your Stremio account.',intro:'Your Stremio login syncs your addons across devices.',html:()=>`${section('1. Sign up',`<p>Use your own email and password. Stremio and TorBox are two different accounts.</p>${link('https://www.stremio.com','Open Stremio')}`)}${section('2. Sign in on your phone or computer',`<p>Use the Stremio app or the website to finish setting up. Don’t use Guest mode — sign in so your addons save and sync.</p>${link('https://web.stremio.com','Open Stremio Web')}`)}<div class="hint">Leave this wizard open in one tab. You can return to it after each addon installation.</div>`},
{title:'Connect Torz.',intro:'Torz is your main stream-finder.',html:()=>`${section('1. Open public StremThru Torz',`<p>This is a public community-hosted instance, not a server you need to run yourself. Availability and maintenance are controlled by its operator.</p>${link('https://stremthrufortheweebs.midnightignite.me/stremio/torz/configure','Configure Torz')}`)}${section('2. Store settings',`<p>Choose <strong>TorBox</strong> for Store Name. Paste your own TorBox API key into Store Token — on the Torz page, not here. Turn on <strong>Only Show Cached Content</strong>.</p>`)}${section('3. Indexers',`<p>Leave the Indexers section empty — those are the search sources, and you don't need them. Do not tap Add.</p>`)}${section('4. Stream Sort — copy exactly',`<p>Paste into the Stream Sort field.</p>${copy(sort,'sort')}`)}${section('5. Stream Filter — advanced',`<p>This filter blocks cam and telesync copies and caps files at 25 GB. If the site shows a parser error, clear the field and install without it — Torz still works, and Comet is there as a backup.</p>${copy(filter,'filter')}`)}${section('6. Install',`<p>Tap Install and confirm in Stremio — Stremio opening to confirm is how you know it worked. Don’t share the install link Stremio generates: it may contain private configuration information.</p>`)}<div class="hint warning">Important: Public addon instances can change or go offline. If this link fails, use the troubleshooting section rather than entering your key on an unfamiliar mirror.</div><div class="checks"><label><input type="checkbox" data-check="3a"> I see Torz in my installed addons.</label></div>`},
{title:'Connect Comet.',intro:'Comet is your second stream-finder — a backup if Torz misses something.',html:()=>`${section('1. Open Comet',`<p>Open the Comet configuration page and select TorBox as the debrid provider.</p>${link('https://comet.elfhosted.com/configure','Configure Comet')}`)}${section('2. Paste your TorBox API key',`<p>Copy it from TorBox settings and paste it directly into Comet — on Comet's page, not here.</p>`)}${section('3. Recommended starting settings',`<p>Turn on cached-only streams, duplicate removal, and low-quality filtering. Set the file limit to 25 GB. Labels may vary slightly by version.</p>`)}${section('4. Install',`<p>Tap Install, confirm the installation in Stremio, and return here. Stremio opening to confirm is how you know it worked.</p>`)}<div class="hint">If the page doesn’t open Stremio automatically, use the addon install link in Stremio’s addon installation field. Keep that personalized link private.</div><div class="checks"><label><input type="checkbox" data-check="4a"> I see Comet in my installed addons.</label></div>`},
{title:'Watch on your TV.',intro:'Your addons should already be linked to your Stremio account.',html:()=>`${section('1. Install Stremio',`<p>On Google TV / Onn / Android TV, open the Play Store and install Stremio. On other devices, use the official download instructions.</p>${link('https://www.stremio.com/downloads','Stremio downloads')}`)}${section('2. Sign in',`<p>Use the <strong>same Stremio account</strong> from earlier. Wait for your addons to sync.</p>`)}${section('3. Test playback',`<p>Search for a movie or show you want to watch. Select an available TorBox cached stream. For most TVs, 1080p is a good starting point. If it buffers, try a smaller file.</p>`)}${section('Reading the stream list',`<p>Ignore the long filenames — just look at the resolution (like 1080p) and the file size. Everything listed is ready to play.</p>`)}${section('On an iPhone or iPad instead?',`<p>Open web.stremio.com in Safari, sign in, and dismiss the 'Streaming server is not available' warning if it appears. Set Stremio to play in an external player, and install VLC or Outplayer first — otherwise tapping a stream gives an 'address is invalid' error.</p>`)}<div class="checks"><label><input type="checkbox" data-check="5a"> I can see Torz or Comet stream results.</label><label><input type="checkbox" data-check="5b"> Playback works on my device.</label></div>`},
{title:'All set! Keep this link.',intro:'Come back whenever you need to fix something or set up another device.',html:()=>`<div class="hint">You’ve completed the setup. Save or bookmark this page for later.</div>${section('Optional: Organize your addons',`<p>You don't need this to watch anything — your setup is already complete. Want to change the order your addons appear in Stremio? The Addon Manager makes it easy.</p><p>Open the manager, sign in using its supported method, load your addons, arrange your addons, and sync to save your changes.</p>${link('https://markvsqz.github.io/stremio-addon-manager/','Open addon manager')}<p class="muted">It's unofficial and signs in with your Stremio account. There's no undo — if a change goes wrong, uninstall and reinstall your addons in the order you want.</p>`)}<details><summary>Nothing plays or no streams appear</summary><p>Check your TorBox subscription, verify you’re signed into the correct Stremio account, and try another available stream. Reinstall Comet or Torz if you changed the API key.</p></details><details><summary>Video buffers</summary><p>Try a smaller 1080p stream, restart Stremio and your streaming device, and check your network connection.</p></details><details><summary>How do I use an iPhone or iPad?</summary><p>See the iPhone/iPad section in the 'Watch on your TV' step.</p></details><details><summary>What if the public Torz instance stops working?</summary><p>Comet might still work on its own. Don’t paste your API key into any random replacement site.</p></details><details><summary>Why do I need to reinstall an addon after changing settings?</summary><p>Changing settings makes a new install link. Reinstall the addon to use the new settings.</p></details><button class="action secondary" id="restart">Start over ↺</button>`}
];
let current=Math.min(Math.max(parseInt(localStorage.getItem('wizard-step')||'0',10)||0,0),steps.length-1);
function render(){document.getElementById('progress').innerHTML=steps.map((_,i)=>{const st=i<current?'done':i===current?'now':'';const label=i<current?'completed':i===current?'current':'not started';return `<span class="${st}"><span class="sr-only">Step ${i+1}: ${label}</span></span>`}).join('');document.getElementById('stepcount').textContent=`Step ${current+1} of ${steps.length}`;document.getElementById('content').innerHTML=`<h1>${steps[current].title}</h1><p>${steps[current].intro}</p>${steps[current].html()}`;document.getElementById('back').disabled=current===0;document.getElementById('next').textContent='Next step →';document.getElementById('next').style.display=current===steps.length-1?'none':'';document.querySelectorAll('[data-copy]').forEach(btn=>btn.addEventListener('click',async()=>{let value=btn.dataset.copy==='referral'?referral:btn.dataset.copy==='sort'?sort:filter;try{await navigator.clipboard.writeText(value);btn.textContent='Copied ✓';setTimeout(()=>btn.textContent='Copy',1600)}catch(e){btn.textContent='Select text above'}}));document.querySelectorAll('[data-check]').forEach(input=>{input.checked=localStorage.getItem('wizard-check-'+input.dataset.check)==='yes';input.addEventListener('change',()=>localStorage.setItem('wizard-check-'+input.dataset.check,input.checked?'yes':'no'))});document.getElementById('restart')?.addEventListener('click',()=>{current=0;localStorage.setItem('wizard-step',current);Object.keys(localStorage).filter(k=>k.startsWith('wizard-check-')).forEach(k=>localStorage.removeItem(k));render();window.scrollTo(0,0)})}
document.getElementById('back').onclick=()=>{current=Math.max(0,current-1);localStorage.setItem('wizard-step',current);render();window.scrollTo(0,0)};document.getElementById('next').onclick=()=>{const gate=current===3?'3a':current===4?'4a':null;if(gate){const box=document.querySelector('[data-check="'+gate+'"]');if(box&&!box.checked){const name=current===3?'Torz':'Comet';if(!confirm("Heads up — you haven't checked 'I see "+name+" in my installed addons' yet. If "+name+" isn't installed, the later steps won't work as expected. Tap OK to continue anyway, or Cancel to stay here."))return;}}if(current<steps.length-1){current++;localStorage.setItem('wizard-step',current);render();window.scrollTo(0,0)}};render();
</script></body></html>
